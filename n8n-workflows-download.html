<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Descargar Workflows n8n</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 { text-align: center; }
    .button {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
    }
    .button:hover { background: #0052a3; }
    .info {
      background: white;
      padding: 15px;
      border-radius: 5px;
      margin: 20px 0;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Descargar Workflows n8n</h1>

  <button class="button" onclick="descargar('workflow-7am')">Descargar: Workflow 7 AM</button>
  <button class="button" onclick="descargar('workflow-12pm')">Descargar: Workflow 12 PM</button>

  <div class="info">
    <strong>Próximos pasos:</strong><br>
    1. Descargá ambos archivos<br>
    2. En n8n: "Import from URL or JSON"<br>
    3. Pegá el contenido de cada archivo<br>
    4. Reemplazá los placeholders con tus datos
  </div>

  <script>
    const workflows = {
      'workflow-7am': {
        "name": "Article Sync to Sheets - 7 AM",
        "nodes": [{"parameters":{"rule":{"interval":[{"field":"hours","value":7}]}},"type":"n8n-nodes-base.scheduleTrigger","typeVersion":1.1,"position":[250,300],"name":"Schedule - 7 AM","id":"node_schedule_7am"},{"parameters":{"url":"https://ttjrcqvshgaoljsyxupe.supabase.co/rest/v1/articulos?select=titulo,seccion,fecha,slug&created_at=gte.{{$now.minus(24,'hours').toISO()}}&order=created_at.desc","authentication":"genericCredentialType","genericAuthType":"httpHeaderAuth","sendHeaders":true,"headerParameters":{"parameters":[{"name":"apikey","value":"={{$secrets.SUPABASE_API_KEY}}"},{"name":"Authorization","value":"=Bearer {{$secrets.SUPABASE_API_KEY}}"}]}},"type":"n8n-nodes-base.httpRequest","typeVersion":4.1,"position":[450,300],"name":"Get Articles from Supabase","id":"node_supabase"},{"parameters":{"spreadsheetId":"={{$secrets.GOOGLE_SHEETS_SPREADSHEET_ID}}","range":"={{$secrets.GOOGLE_SHEETS_SHEET_NAME}}","values":"=[[item.titulo, item.seccion, item.fecha, \"https://latinmediaok.com/nota/\" + item.slug]]"},"type":"n8n-nodes-base.googleSheets","typeVersion":4.4,"position":[650,300],"name":"Append to Google Sheets","id":"node_sheets"}],
        "connections": {"node_schedule_7am":{"main":[[{"node":"node_supabase","type":"main","index":0}]]},"node_supabase":{"main":[[{"node":"node_sheets","type":"main","index":0}]]}}
      },
      'workflow-12pm': {
        "name": "Article Sync to Sheets - 12 PM",
        "nodes": [{"parameters":{"rule":{"interval":[{"field":"hours","value":12}]}},"type":"n8n-nodes-base.scheduleTrigger","typeVersion":1.1,"position":[250,300],"name":"Schedule - 12 PM","id":"node_schedule_12pm"},{"parameters":{"url":"https://ttjrcqvshgaoljsyxupe.supabase.co/rest/v1/articulos?select=titulo,seccion,fecha,slug&created_at=gte.{{$now.minus(24,'hours').toISO()}}&order=created_at.desc","authentication":"genericCredentialType","genericAuthType":"httpHeaderAuth","sendHeaders":true,"headerParameters":{"parameters":[{"name":"apikey","value":"={{$secrets.SUPABASE_API_KEY}}"},{"name":"Authorization","value":"=Bearer {{$secrets.SUPABASE_API_KEY}}"}]}},"type":"n8n-nodes-base.httpRequest","typeVersion":4.1,"position":[450,300],"name":"Get Articles from Supabase","id":"node_supabase"},{"parameters":{"spreadsheetId":"={{$secrets.GOOGLE_SHEETS_SPREADSHEET_ID}}","range":"={{$secrets.GOOGLE_SHEETS_SHEET_NAME}}","values":"=[[item.titulo, item.seccion, item.fecha, \"https://latinmediaok.com/nota/\" + item.slug]]"},"type":"n8n-nodes-base.googleSheets","typeVersion":4.4,"position":[650,300],"name":"Append to Google Sheets","id":"node_sheets"}],
        "connections": {"node_schedule_12pm":{"main":[[{"node":"node_supabase","type":"main","index":0}]]},"node_supabase":{"main":[[{"node":"node_sheets","type":"main","index":0}]]}}
      }
    };

    function descargar(tipo) {
      const json = workflows[tipo];
      const dataStr = JSON.stringify(json, null, 2);
      const dataBlob = new Blob([dataStr], {type: 'application/json'});
      const url = URL.createObjectURL(dataBlob);
      const link = document.createElement('a');
      link.href = url;
      link.download = tipo + '.json';
      link.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
